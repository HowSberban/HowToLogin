name: Build HowToLogin

on:
  workflow_dispatch:
    inputs:
      release:
        description: '是否创建 Release'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build with Gradle
      run: ./gradlew --no-daemon build -PbuildNumber=${{ github.run_number }}

    - name: Get version from Gradle
      id: get_version
      run: echo "version=$(./gradlew -q properties | grep '^version:' | awk '{print $2}')" >> $GITHUB_OUTPUT

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: HowToLogin-${{ steps.get_version.outputs.version }}-build.${{ github.run_number }}
        path: build/libs/*.jar
        archive: false
        if-no-files-found: error

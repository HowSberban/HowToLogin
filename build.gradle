plugins {
    id 'java'
    id("xyz.jpenilla.run-paper") version "3.0.2"
}

group = 'org.HowToLogin'
version = '0.1.0'

repositories {
    mavenCentral()
    maven {
        name = "papermc-repo"
        url = "https://repo.papermc.io/repository/maven-public/"
    }
    maven {
        name = "placeholderapi-repo"
        url = "https://repo.extendedclip.com/content/repositories/placeholderapi/"
    }
}

dependencies {
    compileOnly("io.papermc.paper:paper-api:1.21.11-R0.1-SNAPSHOT")
    compileOnly("org.xerial:sqlite-jdbc:3.46.1.3")
    compileOnly("com.mysql:mysql-connector-j:8.4.0")
    compileOnly("com.zaxxer:HikariCP:5.1.0")
    compileOnly("org.mindrot:jbcrypt:0.4")
    compileOnly("me.clip:placeholderapi:2.11.6")
}

configurations.configureEach {
    resolutionStrategy.force(
            'org.codehaus.plexus:plexus-utils:3.6.1',
            'org.apache.commons:commons-lang3:3.18.0',
            'com.google.protobuf:protobuf-java:3.25.5'
    )
}

tasks {
    runServer {
        // 配置 Minecraft 版本，必须使用完整版本号
        // 插件的 jar（或 shadowJar）会自动被加载
        minecraftVersion("1.21.11")
    }
}

// 注册 Folia 调试任务：gradle runFolia
runPaper {
    folia.registerTask()
}

def targetJavaVersion = 21
java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    // 始终使用工具链，避免使用仅有 JRE 的环境无法编译
    toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'

    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        options.release.set(targetJavaVersion)
    }
}

processResources {
    def fullVersion = version
    // 配置文件版本只取前两位（major.minor），patch 版本仅修 bug 不改配置，不触发覆盖
    def parts = fullVersion.split('-')[0].split('\\.')
    def configVersion = parts.length >= 2 ? "${parts[0]}.${parts[1]}" : fullVersion
    inputs.properties([version: fullVersion, configVersion: configVersion])
    filteringCharset 'UTF-8'
    filesMatching('paper-plugin.yml') {
        expand version: fullVersion
    }
    filesMatching('config.yml') {
        expand configVersion: configVersion
    }
}
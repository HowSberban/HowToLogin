# HTLogin 插件语言文件 - 简体中文

plugin.disabled=HTLogin 已禁用！
plugin.config_reload_log=配置文件已重新加载
plugin.enabled=HTLogin v{0} 已启用
plugin.config_version_mismatch=配置文件版本不匹配（当前: {0}, 预期: {1}），已重置配置和语言文件
plugin.lang_version_mismatch=语言文件版本不匹配（当前: {0}, 预期: {1}），已更新语言文件

# 通用
command.player_only=&c只有玩家才能使用此命令。
command.password_length=&c密码长度必须在 {0} 到 {1} 个字符之间。

# 注册
register.usage=&c用法: /register <密码> <确认密码>
register.already_registered=&c你已注册账号，请使用 /login 登录。
register.password_mismatch=&c两次输入的密码不一致。
register.success=&a注册成功！你已自动登录。
register.failed=&c注册失败，请重试。
register.ip_limit=&c此 IP 注册的账号数量已达上限（{0} 个），请联系管理员。

# 登录
login.usage=&c用法: /login <密码>
login.already_logged_in=&a你已经登录了。
login.no_account=&c你还没有账号，请注册。
login.incorrect_password=&c密码错误。
login.kicked=&c密码错误次数过多，请 {0} 秒后再试。
login.success=&a登录成功！
login.ip_auto_login=&a您已自动登录。

# 改密
changepw.usage=&c用法: /changepassword <旧密码> <新密码>
changepw.must_login=&c你必须先登录才能修改密码。
changepw.incorrect_old=&c旧密码错误。
changepw.success=&a密码修改成功！

# 登出
logout.not_logged_in=&c你尚未登录。
logout.success=&a你已退出登录。

# 删除账号
unregister.not_found=&c未找到玩家或玩家未注册账号。
unregister.success=&a已成功删除 {0} 的账号。
unregister.kick=&c管理员已删除你的账号，请重新注册。

# 管理命令
htlogin.usage=&c用法: /htlogin reload | accounts <玩家> | forcelogout <玩家> | forcechangepw <玩家> <新密码> | forcelogin <玩家>
htlogin.reload_success=&a配置文件已重新加载！
htlogin.accounts_not_found=&c未找到玩家或玩家未注册账号。
htlogin.accounts_no_ip=&c该玩家没有 IP 记录。
htlogin.accounts_result=&e玩家 &f{0} &e的 IP 为 &f{1}&e，该 IP 共有 &f{2} &e个其它账号：
htlogin.forcelogout_success=&a已强制登出 &f{0}&a。
htlogin.forcelogout_kick=&c管理员已强制将你登出。
htlogin.not_logged_in=&c玩家 &f{0} &c未登录。
htlogin.forcechangepw_success=&a已将 &f{0} &a的密码修改为新密码。
htlogin.forcechangepw_kick=&c管理员已修改你的密码，请重新登录。
htlogin.forcelogin_success=&a已强制登录 &f{0}&a。
htlogin.player_not_online=&c玩家 &f{0} &c不在线。
htlogin.already_logged_in=&c玩家 &f{0} &c已经登录。

# 监听器
listener.please_login=&e请使用 /login <密码> 登录
listener.please_register=&e请使用 /register <密码> <确认密码> 注册
listener.login_timeout=&c登录超时
listener.must_login=&c请先登录。

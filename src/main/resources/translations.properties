# HTLogin 插件语言文件

plugin.disabled=HTLogin 已禁用！
plugin.config_reload_log=配置文件已重新加载
plugin.folia_detected=检测到 Folia — 使用区域化调度器
plugin.enabled=HTLogin v{0} 已启用

# 通用
command.player_only=&c只有玩家才能使用此命令。
command.password_length=&c密码长度必须在 {0} 到 {1} 个字符之间。

# 注册
register.usage=&c用法: /register <密码> <确认密码>
register.already_registered=&c你已注册账号，请使用 /login 登录。
register.password_mismatch=&c两次输入的密码不一致。
register.success=&a注册成功！你已自动登录。
register.failed=&c注册失败，请重试。

# 登录
login.usage=&c用法: /login <密码>
login.already_logged_in=&a你已经登录了。
login.no_account=&c你还没有账号。使用 /register <密码> <确认密码>
login.incorrect_password=&c密码错误。
login.success=&a登录成功！

# 改密
changepw.usage=&c用法: /changepassword <旧密码> <新密码>
changepw.must_login=&c你必须先登录才能修改密码。
changepw.incorrect_old=&c旧密码错误。
changepw.success=&a密码修改成功！

# 登出
logout.not_logged_in=&c你尚未登录。
logout.success=&a你已退出登录。

# 删除账号
unregister.usage=&c用法: /unregister <玩家>
unregister.not_found=&c未找到玩家或玩家未注册账号。
unregister.success=&a已成功删除 {0} 的账号。

# 管理命令
htlogin.usage=&c用法: /htlogin reload
htlogin.reload_success=&a配置文件已重新加载！
htlogin.unknown_subcommand=&c未知子命令。用法: /htlogin reload

# 监听器
listener.welcome=&a欢迎来到服务器！请登录或注册。
listener.please_login=&e请使用 /login <密码> 登录
listener.please_register=&e请使用 /register <密码> <确认密码> 注册
listener.login_timeout=&c登录超时，请重新连接并登录。
listener.must_login=&c请先登录。
listener.must_login_cmd=&c请先登录。使用 /login <密码>
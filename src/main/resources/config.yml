# HTLogin 配置文件

# 配置文件版本（完整版本号），请勿修改
version: ${version}

# 数据库设置
database:
  # 数据库类型：sqlite 或 mysql
  type: sqlite
  # MySQL 配置（仅 type=mysql 时生效）
  mysql:
    host: localhost
    # 端口（有效范围 1-65535）
    port: 3306
    database: htlogin
    username: root
    password: ""
    # 连接池大小（有效范围 1-128）
    pool-size: 10
    # 连接参数（键值对，拼接到 JDBC URL）
    params:
      useSSL: "false"
      useUnicode: "true"
      characterEncoding: "UTF-8"

# 登录设置
login:
  # 登录超时时间（秒），0 = 不限制
  timeout: 120
  # 超时未登录是否踢出玩家
  kick-on-timeout: true
  # 登录失败保护
  fail-protection:
    enabled: true
    # 连续登录失败次数上限，超过后踢出
    max-attempts: 3
    # 踢出时长（秒），期间无法再次进服
    kick-duration: 60
    # 失败计数过期时间（秒）：超过此时长未再失败则清零，0 = 永不过期
    # 计数跨连接累计以防重连绕过上限，设过期时间则避免长期不清误伤正常玩家
    reset-seconds: 300
  # 提示消息重复发送间隔（秒），0 = 仅发送一次
  remind-interval: 5
  # 提示消息发送方式：chat（聊天栏）/ title（标题）/ actionbar（动作栏）/ bossbar（Boss 栏）
  remind-method: chat
  # 登录窗口（1.21.11+）：进入世界前弹出图形化窗口完成登录/注册/2fa
  # 登录前客户端不接收任何世界信息，无需坐标保护
  dialog:
    enabled: true
    # 在 1.21.6–1.21.10 冒险启用登录窗口：该版本段存在未验证的兼容问题，默认关闭
    # 启用需自担风险，服务端与客户端版本均须不低于 1.21.6
    allow-risky-versions: false
  # IP 变动提醒：登录 IP 与上次不同时提示玩家
  ip-change-notify:
    enabled: true
  # IP 免密登录：上次登录 IP 与当前一致时自动登录
  ip-auto-login:
    enabled: true
    # 失效时间（分钟），超过此时间后需重新输入密码
    # 0 = 永不失效
    expire-minutes: 120
  # 双因素认证（TOTP）
  2fa:
    # 是否启用双因素认证
    # 关闭后已绑定玩家跳过验证直接登录，密钥不删，重新开启即恢复
    enabled: true
    # 绑定时生成的临时密钥有效期（秒），超时后作废需重新 setup
    # 0 = 永不过期
    expire-seconds: 300

# 注册设置
register:
  # 注册超时时间（秒），0 = 不限制
  timeout: 120
  # 同一 IP 最大账号数量，0 = 不限制
  max-accounts-per-ip: 3

# 密码规则
password:
  # 密码最小长度（不得小于 4）
  min-length: 6
  # 密码最大长度（不得大于 128，且不得小于最小长度）
  max-length: 32
  # 密码哈希算法
  # bcrypt：更强，但更慢
  # sha256：更快，但更易被破解
  hash: bcrypt
  # BCrypt work factor
  # 数值范围 4-31，越大越安全但越慢
  # 12 是一个很好的平衡
  hash-cost: 12
  # 密码字符规则：正则表达式，留空表示不限制
  pattern: '^[a-zA-Z0-9!@#$%^&*()\-_=+\[\]{}|;:,.<>?]+$'

# 行为限制（登录前禁止的行为）
prevent:
  # 禁止移动
  move: true
  # 禁止转动视角（仅当 move 启用时生效）
  look: true
  # 禁止聊天
  chat: true
  # 禁止执行非白名单命令
  command:
    enabled: true
    whitelist:
      - login
      - l
      - register
      - reg
      - 2fa
      - totp
  # 禁止与世界交互
  world-interaction: true
  # 禁止背包交互
  inventory: true

# 登录前保护
protection:
  # 坐标保护（未登录时在主世界出生点周围随机位置等待，登录后传送回上次退出位置
  # 与CatSeedLogin不同，开启此保护不会导致玩家位置丢失
  pos:
    enabled: false
    # 坐标模式：random（随机）或 fixed（固定坐标）
    mode: random
    # random：在世界出生点周围的随机半径（方块数），每次加入位置不同，避免玩家堆积
    spawn-radius: 10
    # fixed: 使用此坐标
    fixed:
      x: 0
      y: 64
      z: 0
      yaw: 0
      pitch: 0
  # 未登录旁观模式：未登录期间切换为旁观，登录后恢复上次的游戏模式
  # 首次注册的玩家恢复为服务器默认模式（server.properties 的 level-default-gamemode）
  # 若坐标保护关闭且上次退出位置悬空，该玩家强制旁观，避免落地摔落伤害
  gamemode:
    enabled: false
  # 背包保护：未登录玩家无法查看背包
  # 通过 PacketEvents 拦截物品数据包，防止恶意玩家窥视背包内容
  inventory:
    enabled: false

# 通用设置
settings:
  # 默认语言
  # 可在插件 lang/ 目录添加 <语言>.properties 支持更多语言
  default-language: zh_CN
  # 是否根据客户端语言自动匹配消息（关闭则所有玩家使用默认语言）
  i18n: true
  # 注销账号时是否删除 Minecraft 原版玩家数据（player.dat）
  # 包含背包、装备、血量、经验、位置、末影箱等
  real-unreg: true
  # 清理不活跃账号：启动时删除超过 days 天未登录的账号（正版账号不受影响）
  purge:
    enabled: false
    days: 90

# 正版验证
# 可以让正版玩家换名也不会丢失数据
premium:
  # 正版验证总开关，关闭后所有玩家都不走验证（含已注册正版玩家）
  enabled: false
  # 新玩家进服时是否自动尝试正版验证
  # true：新玩家自动验证，通过即以正版身份进入
  # false：一律按离线身份进入，需手动 /upgrade 升级
  auto-verify: true
  # 无法直连 Mojang 时使用的 HTTP 代理，多行输入
  # 请求仍发往官方地址，仅借道代理转发
  http-proxies:
    - 'example.com:25565'
  # hasJoined 接口的镜像服务器，不要使用不可信的第三方镜像！
  session-server-mirrors:
    - 'https://mirror.example.com'
  # 单次 hasJoined 请求超时（秒），正常响应在 1 秒内，此值仅兜底挂起请求
  timeout-seconds: 5
  # 一次完整验证（含端点切换与重试）的总时限（毫秒）
  # 客户端约 30 秒无响应即断开，不要超过 30000
  verify-deadline-ms: 30000
  # 离线客户端标记缓存时长（秒），检测到离线客户端后记下其 IP+名
  # 期间重连直接按离线处理，不必重复验证
  cracker-cache-seconds: 120
  # 加密握手阶段等待 EncryptionResponse 的超时（毫秒），防止会话被挂机客户端滞留
  handshake-timeout-ms: 30000
  # 429/5xx（过载）的重试次数，不含首次请求，204（未加入）为确定结论，不重试
  max-retries: 2
  # 重试间隔（毫秒）
  retry-interval-ms: 500
  # 正版验证异步任务线程池大小（2-64），请求为阻塞式任务，高并发验证可调大
  http-pool-size: 2
  # 离线确认 / 回退缓存上限，防止条目过多占用内存
  cache-cap: 1000
  # 离线账号升级为正版
  upgrade:
    # 是否允许玩家从离线升级为正版
    enabled: true
  # 正版验证失败时的回退登录（仅对已注册正版玩家生效），不安全，不建议开启
  # 放行玩家并以已记录的正版 UUID 进入，走密码登录
  fallback:
    enabled: false
    # 回退标记有效期（秒），期间该 IP+名重连直接走回退路径，跳过加密握手
    # 过期后重新尝试正版验证
    cache-seconds: 300
# HTLogin 配置文件

# 数据库设置
database:
  # 数据库类型：sqlite 或 mysql
  type: sqlite
  # MySQL 配置（仅 type=mysql 时生效）
  mysql:
    host: localhost
    port: 3306
    database: htlogin
    username: root
    password: ""
    # 连接池大小
    pool-size: 10
    # 连接参数（键值对，拼接到 JDBC URL）
    params:
      useSSL: "false"
      useUnicode: "true"
      characterEncoding: "UTF-8"

# 登录设置
login:
  # 登录/注册超时时间（秒），0 = 不限制
  timeout: 120
  # 超时未登录是否踢出玩家
  kick-on-timeout: true
  # 连续登录失败次数上限，超过后锁定
  max-attempts: 5
  # 锁定时长（秒）
  lock-duration: 300

# 密码规则
password:
  # 密码最小长度
  min-length: 6
  # 密码最大长度
  max-length: 32
  # 密码哈希算法
  # bcrypt：更强的加密，但需要更多性能
  # sha256：更快的加密，但更易被破解
  # 我想 你服务器也不能差到那种程度，对吧？
  hash: bcrypt

# 行为限制（登录前禁止的行为）
prevent:
  # 禁止移动
  move: true
  # 禁止转动视角（仅当 move 启用时生效）
  look: true
  # 禁止聊天
  chat: true
  # 禁止执行非白名单命令
  command:
    # 是否启用
    enabled: true
    # 未登录时允许执行的命令
    whitelist:
      - login
      - l
      - register
      - reg
  # 禁止与世界交互
  world-interaction: true

# 登录前保护
protection:
  # 坐标保护（未登录时在主世界出生点周围随机位置等待，登录后传送回上次退出位置）
  pos:
    # 是否启用
    enabled: false
    # 在世界出生点周围的随机半径（方块数），每次加入位置不同，避免玩家堆积
    spawn-radius: 10
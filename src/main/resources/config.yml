# HTLogin 配置文件

# 配置文件版本（完整版本号），请勿修改
version: ${version}

# 数据库设置
database:
  # 数据库类型：sqlite 或 mysql
  type: sqlite
  # MySQL 配置（仅 type=mysql 时生效）
  mysql:
    host: localhost
    port: 3306
    database: htlogin
    username: root
    password: ""
    # 连接池大小
    pool-size: 10
    # 连接参数（键值对，拼接到 JDBC URL）
    params:
      useSSL: "false"
      useUnicode: "true"
      characterEncoding: "UTF-8"

# 登录设置
login:
  # 登录/注册超时时间（秒），0 = 不限制
  timeout: 120
  # 超时未登录是否踢出玩家
  kick-on-timeout: true
  # 登录失败保护
  fail-protection:
    enabled: true
    # 连续登录失败次数上限，超过后踢出
    max-attempts: 3
    # 踢出时长（秒），期间无法再次进服
    kick-duration: 60
  # 提示消息重复发送间隔（秒），0 = 仅发送一次
  remind-interval: 5
  # IP 免密登录：上次登录 IP 与当前一致时自动登录
  ip-auto-login:
    enabled: true
    # 失效时间（分钟），超过此时间后需重新输入密码
    # 0 = 永不失效
    expire-minutes: 120

# 注册限制
register:
  # 同一 IP 最大账号数量，0 = 不限制
  max-accounts-per-ip: 3

# 密码规则
password:
  # 密码最小长度
  min-length: 6
  # 密码最大长度
  max-length: 32
  # 密码哈希算法
  # bcrypt：更强的加密，但需要更多性能
  # sha256：更快的加密，但更易被破解
  # 我想 你服务器也不能差到那种程度，对吧？
  hash: bcrypt
  # 密码字符规则：正则表达式（必须完全匹配），留空表示不限制
  pattern: '^[a-zA-Z0-9!@#$%^&*()\-_=+\[\]{}|;:,.<>?]+$'

# 行为限制（登录前禁止的行为）
prevent:
  # 禁止移动
  move: true
  # 禁止转动视角（仅当 move 启用时生效）
  look: true
  # 禁止聊天
  chat: true
  # 禁止执行非白名单命令
  command:
    enabled: true
    whitelist:
      - login
      - l
      - register
      - reg
  # 禁止与世界交互
  world-interaction: true
  # 禁止背包交互
  inventory: true

# 登录前保护
protection:
  # 坐标保护（未登录时在主世界出生点周围随机位置等待，登录后传送回上次退出位置
  # 与CatSeedLogin不同，开启此保护不会导致玩家位置丢失）
  pos:
    enabled: false
    # 坐标模式：random（随机）或 fixed（固定坐标）
    mode: random
    # random：在世界出生点周围的随机半径（方块数），每次加入位置不同，避免玩家堆积
    spawn-radius: 10
    # fixed: 使用此坐标
    fixed:
      x: 0
      y: 64
      z: 0
      yaw: 0
      pitch: 0
  # 背包保护：未登录玩家无法查看自己的背包
  # 需要前置插件 PacketEvents
  inventory:
    enabled: false

# 通用设置
settings:
  # 默认语言
  # 可在插件 lang/ 目录添加 <语言>.properties 支持更多语言
  default-language: zh_CN
  # 是否根据客户端语言自动匹配消息（关闭则所有玩家使用默认语言）
  i18n: true
  # 注销账号时是否删除 Minecraft 原版玩家数据（player.dat）
  # 包含背包、装备、血量、经验、位置、末影箱等
  real-unreg: true

# 正版验证（需要前置插件 PacketEvents）
# 在 online-mode=false 的服务端上，通过 PacketEvents 拦截登录流程，
# 让正版客户端完成 Mojang 加密验证，获取真实正版 UUID 并实现免密进服
premium:
  # 是否启用正版验证（总开关）
  enabled: false
  # hasJoined HTTP 超时（秒），超时视为 Mojang 服务不可用
  timeout-seconds: 10
  # 离线客户端首次失败后的重连缓存有效期（秒）
  # 检测到离线客户端后标记 IP+名，有效期内重连直接走离线登录
  cracker-cache-seconds: 120
# HTLogin 配置文件

# 配置文件版本（完整版本号），请勿修改
version: ${version}

# 数据库设置
database:
  # 数据库类型：sqlite 或 mysql
  type: sqlite
  # MySQL 配置（仅 type=mysql 时生效）
  mysql:
    host: localhost
    # 端口（有效范围 1-65535）
    port: 3306
    database: htlogin
    username: root
    password: ""
    # 连接池大小（有效范围 1-128）
    pool-size: 10
    # 连接参数（键值对，拼接到 JDBC URL）
    params:
      useSSL: "false"
      useUnicode: "true"
      characterEncoding: "UTF-8"

# 登录设置
login:
  # 登录/注册超时时间（秒），0 = 不限制
  timeout: 120
  # 超时未登录是否踢出玩家
  kick-on-timeout: true
  # 登录失败保护
  fail-protection:
    enabled: true
    # 连续登录失败次数上限，超过后踢出
    max-attempts: 3
    # 踢出时长（秒），期间无法再次进服
    kick-duration: 60
    # 失败计数过期时间（秒）：玩家最后一次失败超过此时长未再失败则清空计数
    # 失败计数跨连接保留（防止"失败后重连"绕过阈值），此配置用于超时后自动清空，
    # 避免误伤间隔较久的正常玩家；0 = 永不过期
    reset-seconds: 300
  # 提示消息重复发送间隔（秒），0 = 仅发送一次
  remind-interval: 5
  # IP 免密登录：上次登录 IP 与当前一致时自动登录
  ip-auto-login:
    enabled: true
    # 失效时间（分钟），超过此时间后需重新输入密码
    # 0 = 永不失效
    expire-minutes: 120

# 注册限制
register:
  # 同一 IP 最大账号数量，0 = 不限制
  max-accounts-per-ip: 3

# 密码规则
password:
  # 密码最小长度（不得小于 4）
  min-length: 6
  # 密码最大长度（不得大于 128，且不得小于最小长度）
  max-length: 32
  # 密码哈希算法
  # bcrypt：更强的加密，但需要更多性能
  # sha256：更快的加密，但更易被破解
  # 我想 你服务器也不能差到那种程度，对吧？
  hash: bcrypt
  # 密码字符规则：正则表达式（必须完全匹配），留空表示不限制
  pattern: '^[a-zA-Z0-9!@#$%^&*()\-_=+\[\]{}|;:,.<>?]+$'

# 行为限制（登录前禁止的行为）
prevent:
  # 禁止移动
  move: true
  # 禁止转动视角（仅当 move 启用时生效）
  look: true
  # 禁止聊天
  chat: true
  # 禁止执行非白名单命令
  command:
    enabled: true
    whitelist:
      - login
      - l
      - register
      - reg
  # 禁止与世界交互
  world-interaction: true
  # 禁止背包交互
  inventory: true

# 登录前保护
protection:
  # 坐标保护（未登录时在主世界出生点周围随机位置等待，登录后传送回上次退出位置
  # 与CatSeedLogin不同，开启此保护不会导致玩家位置丢失）
  pos:
    enabled: false
    # 坐标模式：random（随机）或 fixed（固定坐标）
    mode: random
    # random：在世界出生点周围的随机半径（方块数），每次加入位置不同，避免玩家堆积
    spawn-radius: 10
    # fixed: 使用此坐标
    fixed:
      x: 0
      y: 64
      z: 0
      yaw: 0
      pitch: 0
  # 未登录旁观模式：未登录期间切换为旁观模式，登录后恢复上次游戏模式
  # 第一次注册的玩家切换为服务器默认游戏模式（server.properties 中的 level-default-gamemode）
  # 当玩家上次退出保存的位置为悬空的位置，且坐标保护未开启时，无论该功能是否开启，都切换为旁观模式
  gamemode:
    enabled: false
  # 背包保护：未登录玩家无法查看自己的背包
  # 需要前置插件 PacketEvents
  inventory:
    enabled: false

# 通用设置
settings:
  # 默认语言
  # 可在插件 lang/ 目录添加 <语言>.properties 支持更多语言
  default-language: zh_CN
  # 是否根据客户端语言自动匹配消息（关闭则所有玩家使用默认语言）
  i18n: true
  # 注销账号时是否删除 Minecraft 原版玩家数据（player.dat）
  # 包含背包、装备、血量、经验、位置、末影箱等
  real-unreg: true

# 正版验证（需要前置插件 PacketEvents）
# 在 online-mode=false 的服务端上，通过 PacketEvents 拦截登录流程，
# 让正版客户端完成 Mojang 加密验证，获取真实正版 UUID 并实现免密进服
premium:
  # 是否启用正版验证（总开关，控制升级验证与已注册正版玩家的验证）
  enabled: false
  # 新玩家自动正版验证：开启时新进服玩家自动尝试正版验证
  # 关闭时新玩家直接以离线身份进入，仅通过 /upgrade 标记的玩家会进行正版验证
  # 已注册正版玩家（premium=1）不受此开关影响，始终验证
  auto-verify: true
  # hasJoined HTTP 超时（秒），超时视为 Mojang 服务不可用
  timeout-seconds: 10
  # 离线客户端首次失败后的重连缓存有效期（秒）
  # 检测到离线客户端后标记 IP+名，有效期内重连直接离线登录
  cracker-cache-seconds: 120
  # 加密握手阶段等待 EncryptionResponse 的超时（毫秒）
  # 防止恶意客户端收到 EncryptionRequest 后既不回传也不断开，导致会话滞留内存
  handshake-timeout-ms: 30000
  # hasJoined 首次调用前等待（毫秒）
  initial-delay-ms: 1000
  # hasJoined 可重试状态码的最大重试次数（不含首次尝试）
  max-retries: 2
  # 重试指数退避基数（毫秒），第 n 次重试等待 base * 2^n
  retry-backoff-base-ms: 5000
  # Mojang hasJoined / 正版验证异步任务专用线程池大小（有效范围 2-64）
  # 请求含 sleep + 退避重试为阻塞式任务，高并发正版验证时可按负载调大
  http-pool-size: 2
  # 离线确认/正版回退缓存硬上限
  # 超过时先清过期项，仍超限则逐出最早到期的项，防止内存膨胀
  cache-cap: 1000
  # 离线账号升级为正版账号
  upgrade:
    # 是否启用升级功能（玩家可从离线升级为正版）
    enabled: false
  # 正版验证失败回退（仅对数据库中已注册的正版玩家生效），不建议开启
  # 当正版验证失败时，放行该玩家以已记录的正版 UUID 身份进入，使用密码登录以继承之前游玩的数据。
  # 注意：此功能绕过正版验证，安全不可保证！
  fallback:
    enabled: false
    # 回退标记有效期（秒）：正版验证失败后，该 IP+名 在此期间重连直接走回退路径（跳过加密握手）
    # 过期后重连将重新尝试正版验证（有效范围 ≥ 30）
    cache-seconds: 300